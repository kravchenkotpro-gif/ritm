<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Ritm: navy tile with a coral ribbon of three rising bars (the rhythm). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2b4b67"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="ribbon" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="420">
      <stop offset="0" stop-color="#ffb08a"/>
      <stop offset="1" stop-color="#e0654a"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#050d16" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <path filter="url(#lift)" fill="none" stroke="url(#ribbon)" stroke-width="62" stroke-linecap="round" stroke-linejoin="round"
    d="M138 386 V312 Q138 260 182 290 L226 342 Q256 378 256 330 V224 Q256 172 300 202 L344 254 Q374 290 374 242 V126"/>
</svg>
